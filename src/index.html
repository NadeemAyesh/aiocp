    /* App Preloader / Splash Screen */
    #app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, #00284d 0%, #001326 100%);
      color: #ffffff;
      font-family: 'Almarai', system-ui, -apple-system, sans-serif;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s ease;
      overflow: hidden;
      direction: rtl;
    }
    #app-preloader.app-preloader--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-halo {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 146, 30, 0.22) 0%, rgba(0, 67, 128, 0.15) 50%, transparent 70%);
      filter: blur(35px);
      animation: preloaderHalo 2.5s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .preloader-card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 90%;
    }
    .preloader-logo-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      border-radius: 28px;
      background: #ffffff;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.2);
      margin-bottom: 1.5rem;
      animation: preloaderScale 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .preloader-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .preloader-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 0.5rem 0;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    .preloader-slogan {
      font-size: 0.875rem;
      font-weight: 700;
      color: #f4921e;
      margin: 0 0 1.75rem 0;
    }
    .preloader-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 1rem;
    }
    .preloader-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #f4921e 0%, #ffb347 50%, #38bdf8 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(244, 146, 30, 0.6);
      animation: preloaderFill 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .preloader-caption {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
    }
    .preloader-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f4921e;
      animation: preloaderBlink 1.2s ease-in-out infinite;
    }
    @keyframes preloaderHalo {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes preloaderScale {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes preloaderFill {
      0% { width: 0%; }
      60% { width: 70%; }
      100% { width: 100%; }
    }
    @keyframes preloaderBlink {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }

  <!-- Fallback Google Fonts Connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Immediate Theme Initialization to avoid flash of wrong theme (FOUC) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('palimar_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>

<body class="bg-pattern text-slate-800 antialiased selection:bg-sky-700 selection:text-white">
  <!-- Brand Preloader Splash Screen -->
  <div id="app-preloader">
    <div class="preloader-halo"></div>
    <div class="preloader-card">
      <div class="preloader-logo-wrap">
        <img src="images/logo-palimar.png" alt="شعار الهيئة العربية الدولية للإعمار في فلسطين" />
      </div>
      <h2 class="preloader-title">الهيئة العربية الدولية للإعمار في فلسطين</h2>
      <p class="preloader-slogan">معاً نبني الأمل ونستعيد الحياة</p>
      
      <div class="preloader-track">
        <div class="preloader-bar"></div>
      </div>

      <div class="preloader-caption">
        <span class="preloader-dot"></span>
        <span>جاري تحميل البوابة الرسمية...</span>
      </div>
    </div>
  </div>

  <app-root></app-root>

  <script>
    // Fallback: dismiss preloader after timeout in case of connection latency
    window.addEventListener('load', function() {
      setTimeout(function() {
        var p = document.getElementById('app-preloader');
        if (p && !p.classList.contains('app-preloader--hidden')) {
          p.classList.add('app-preloader--hidden');
          setTimeout(function() { if (p && p.parentNode) p.parentNode.removeChild(p); }, 650);
        }
      }, 4000);
    });
  </script>
</body>
