<!-- Main Web Application Wrapper -->
<div class="min-h-screen flex flex-col justify-between selection:bg-[#f4921e] selection:text-[#001f3b]">

  <!-- 1. Header & Navigation (Integrated with Hero) -->
  <app-header
    (searchClicked)="onOpenSearch()"
    (donateClicked)="onOpenDonate()"
  ></app-header>

  <!-- Main Content Area -->
  <main class="flex-grow">
    <!-- 2. Hero: Modern Interactive News & Activities Slider -->
    <app-hero-slider
      (donateTrigger)="onOpenDonate()"
    ></app-hero-slider>

    <!-- 3. News & Activities Section (Content Focus) -->
    <app-news-activities
      (articleSelected)="onArticleSelected($event)"
    ></app-news-activities>

    <!-- 4. Projects Section (4 Categorized Tabs with Progress) -->
    <app-projects
      (projectDetails)="onProjectDetails($event)"
      (donateProject)="onDonateProject($event)"
    ></app-projects>

    <!-- 5. Media Center Section (Innovative Visual Presentation) -->
    <app-media-center
      (openVideo)="onOpenVideo($event)"
      (openPhoto)="onOpenPhoto($event)"
    ></app-media-center>

    <!-- 6. About Us, Vision, Mission, Goals, Statistics & Partners -->
    <app-about-vision></app-about-vision>

    <!-- 7. Direct Contribution & Donation Gateway Section (ترغب في المساهمة وإعادة إعمار غزة؟) -->
    <app-direct-donation
      (openDonate)="onOpenDonate()"
    ></app-direct-donation>
  </main>

  <!-- 8. Footer (Exact Clone from donate.aiocp.org) -->
  <app-footer
    (sharePage)="onOpenShare()"
  ></app-footer>

  <!-- Interactive Modals (Projects, Video, Photos, Articles, Share, Search, Donate) -->
  <app-modals
    [selectedProject]="selectedProject()"
    [selectedVideo]="selectedVideo()"
    [selectedPhoto]="selectedPhoto()"
    [selectedArticle]="selectedArticle()"
    [showShareModal]="showShareModal()"
    [showSearchModal]="showSearchModal()"
    [showDonateModal]="showDonateModal()"
    (closeProjectModal)="selectedProject.set(null)"
    (closeVideoModal)="selectedVideo.set(null)"
    (closePhotoModal)="selectedPhoto.set(null)"
    (closeArticleModal)="selectedArticle.set(null)"
    (closeShareModal)="showShareModal.set(false)"
    (closeSearchModal)="showSearchModal.set(false)"
    (closeDonateModal)="showDonateModal.set(false)"
    (openDonate)="onOpenDonate()"
  ></app-modals>

  <!-- Floating Actions Group: Back to Top & Contact/WhatsApp FAB (Bottom-Right) -->
  <div class="fixed bottom-6 left-4 sm:right-6 z-40 flex flex-col items-end gap-3 pointer-events-none">

    <!-- 1. Back to Top Button with Circular Scroll Progress Ring -->
    <button
      type="button"
      (click)="scrollToTop()"
      [class.opacity-0]="!showBackToTop()"
      [class.translate-y-4]="!showBackToTop()"
      [class.pointer-events-none]="!showBackToTop()"
      [class.opacity-100]="showBackToTop()"
      [class.translate-y-0]="showBackToTop()"
      [class.pointer-events-auto]="showBackToTop()"
      class="relative w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-white dark:bg-[#0b1f36] text-[#004380] dark:text-sky-300 hover:text-[#f4921e] dark:hover:text-[#f4921e] border border-slate-200/90 dark:border-white/15 shadow-xl hover:shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300 flex items-center justify-center cursor-pointer group"
      title="الرجوع لأعلى الصفحة"
      aria-label="الرجوع للأعلى"
    >
      <!-- Circular SVG Progress Ring -->
      <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none p-1" viewBox="0 0 36 36">
        <path
          class="text-slate-200/80 dark:text-white/10"
          stroke-width="2.5"
          stroke="currentColor"
          fill="none"
          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
        />
        <path
          class="text-[#f4921e] transition-all duration-150"
          stroke-width="2.5"
          stroke-dasharray="100, 100"
          [attr.stroke-dashoffset]="100 - scrollProgress()"
          stroke-linecap="round"
          stroke="currentColor"
          fill="none"
          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
        />
      </svg>

      <!-- Upward Arrow Icon -->
      <svg class="w-4 h-4 sm:w-5 sm:h-5 transform group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
      </svg>
    </button>

    <!-- 2. Interactive Contact & WhatsApp FAB Menu -->
    <div class="relative pointer-events-auto flex flex-col items-end" (click)="$event.stopPropagation()">

      <!-- Speed-Dial Expandable Menu Card -->
      <div
        *ngIf="isFabOpen()"
        class="mb-3 w-72 sm:w-80 bg-white/95 dark:bg-[#091b2e]/95 backdrop-blur-xl rounded-3xl p-4 border border-slate-200/90 dark:border-white/10 shadow-[0_20px_60px_-15px_rgba(0,40,77,0.3)] dark:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.9)] animate-fabPopup text-right"
      >
        <!-- Panel Header -->
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-white/10">
          <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#004380] to-[#046bd2] text-white flex items-center justify-center shadow-sm shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            </span>
            <div>
              <h4 class="text-xs sm:text-sm font-black text-[#00284d] dark:text-white">مركز التواصل والاستفسار</h4>
              <div class="flex items-center gap-1.5 text-[10px] text-emerald-600 dark:text-emerald-400 font-bold">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                <span>فريق الدعم متاح للرد المباشر</span>
              </div>
            </div>
          </div>
          <button
            type="button"
            (click)="closeFab()"
            class="w-7 h-7 rounded-full hover:bg-slate-100 dark:hover:bg-white/10 text-slate-400 hover:text-slate-600 dark:hover:text-white flex items-center justify-center text-xs transition cursor-pointer"
            aria-label="إغلاق"
          >
            ✕
          </button>
        </div>

        <!-- Action Items -->
        <div class="space-y-2">
          <!-- WhatsApp Direct Link -->
          <a
            href="https://wa.me/962793011191?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D8%A8%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%AD%D9%88%D9%84%20%D9%85%D8%B4%D8%A7%D8%B1%D9%8A%D8%B9%20%D8%A7%D9%84%D9%87%D9%8A%D8%A6%D8%A9"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center justify-between p-2.5 rounded-2xl bg-[#25D366]/10 hover:bg-[#25D366]/20 border border-[#25D366]/30 transition-all duration-200 group"
          >
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-[#25D366] text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform shrink-0">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                  <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.699c.971.53 1.838.813 2.796.813 3.183 0 5.769-2.588 5.769-5.766 0-3.18-2.586-5.766-5.769-5.766zm3.385 8.163c-.145.407-.841.776-1.169.824-.328.047-.758.07-2.222-.536-1.871-.774-3.08-2.673-3.174-.798-.094-.125-.758-1.009-.758-1.925 0-.916.48-1.369.65-1.558.17-.188.373-.235.498-.235.124 0 .25.002.359.007.114.005.267-.043.418.32.156.374.533 1.3.58 1.395.047.094.078.204.016.328-.063.125-.094.203-.188.312-.094.11-.197.245-.281.33-.094.093-.193.195-.083.383.11.188.487.804 1.045 1.3.719.64 1.325.838 1.513.932.188.094.297.078.406-.047.11-.125.469-.547.594-.734.125-.188.25-.156.422-.094.172.062 1.094.516 1.281.609.188.094.312.141.359.219.047.078.047.453-.098.86z"/>
                </svg>
              </div>
              <div class="text-right">
                <span class="block text-xs font-black text-slate-800 dark:text-white">محادثة واتساب فورية</span>
                <span class="block text-[10px] text-slate-500 dark:text-slate-400 font-mono" dir="ltr">+962 79 301 1191</span>
              </div>
            </div>
            <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 group-hover:translate-x-[-2px] transition-transform">‹</span>
          </a>

          <!-- Direct Phone Call -->
          <a
            href="tel:+962793011191"
            class="flex items-center justify-between p-2.5 rounded-2xl bg-blue-50/70 dark:bg-white/5 hover:bg-blue-100/70 dark:hover:bg-white/10 border border-slate-200/80 dark:border-white/10 transition-all duration-200 group"
          >
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-[#004380] text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              </div>
              <div class="text-right">
                <span class="block text-xs font-black text-slate-800 dark:text-white">اتصال هاتفي مباشر</span>
                <span class="block text-[10px] text-slate-500 dark:text-slate-400">للاستفسارات الرسمية والعامة</span>
              </div>
            </div>
            <span class="text-xs font-bold text-slate-400 group-hover:translate-x-[-2px] transition-transform">‹</span>
          </a>

          <!-- Official Email -->
          <a
            href="mailto:info@aiocp.org"
            class="flex items-center justify-between p-2.5 rounded-2xl bg-slate-50 dark:bg-white/5 hover:bg-slate-100 dark:hover:bg-white/10 border border-slate-200/80 dark:border-white/10 transition-all duration-200 group"
          >
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-[#046bd2] text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              </div>
              <div class="text-right">
                <span class="block text-xs font-black text-slate-800 dark:text-white">البريد الإلكتروني</span>
                <span class="block text-[10px] text-slate-500 dark:text-slate-400 font-mono">info@aiocp.org</span>
              </div>
            </div>
            <span class="text-xs font-bold text-slate-400 group-hover:translate-x-[-2px] transition-transform">‹</span>
          </a>

          <!-- FAQ & Information -->
          <a
            href="#about"
            (click)="closeFab()"
            class="flex items-center justify-between p-2.5 rounded-2xl bg-amber-50/70 dark:bg-amber-500/10 hover:bg-amber-100/70 dark:hover:bg-amber-500/20 border border-amber-200/80 dark:border-amber-500/20 transition-all duration-200 group"
          >
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-[#f4921e] text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div class="text-right">
                <span class="block text-xs font-black text-slate-800 dark:text-white">الأسئلة الشائعة والمعلومات</span>
                <span class="block text-[10px] text-[#b86100] dark:text-amber-300">عن الهيئة وتوثيق المشاريع</span>
              </div>
            </div>
            <span class="text-xs font-bold text-amber-600 group-hover:translate-x-[-2px] transition-transform">‹</span>
          </a>
        </div>
      </div>

      <!-- Main FAB Trigger Button -->
      <button
        type="button"
        (click)="toggleFab($event)"
        class="relative z-10 flex items-center gap-2.5 px-4 py-3 sm:px-5 sm:py-3.5 rounded-full bg-gradient-to-r from-[#004380] via-[#00386b] to-[#046bd2] hover:from-[#00284d] hover:to-[#004380] text-white shadow-2xl hover:shadow-blue-900/30 hover:scale-105 active:scale-95 transition-all duration-300 border-2 border-white/25 cursor-pointer group"
        [class.ring-4]="isFabOpen()"
        [class.ring-[#046bd2]/30]="isFabOpen()"
        aria-label="تواصل واستفسار"
        title="تواصل واستفسار"
      >
        <!-- Animated Icon (Chat / Close) -->
        <span class="relative w-6 h-6 flex items-center justify-center">
          <!-- Chat Icon (visible when closed) -->
          <svg
            class="w-5 h-5 transition-all duration-300"
            [class.opacity-0]="isFabOpen()"
            [class.scale-50]="isFabOpen()"
            [class.rotate-90]="isFabOpen()"
            [class.opacity-100]="!isFabOpen()"
            [class.scale-100]="!isFabOpen()"
            fill="none" stroke="currentColor" viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          <!-- Close Icon (visible when open) -->
          <svg
            class="w-5 h-5 absolute transition-all duration-300"
            [class.opacity-100]="isFabOpen()"
            [class.scale-100]="isFabOpen()"
            [class.rotate-0]="isFabOpen()"
            [class.opacity-0]="!isFabOpen()"
            [class.scale-50]="!isFabOpen()"
            [class.-rotate-90]="!isFabOpen()"
            fill="none" stroke="currentColor" viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </span>

        <span class="font-bold text-xs sm:text-sm">تواصل واستفسار</span>

        <!-- Live Pulse Dot -->
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
      </button>

    </div>
  </div>

</div>
