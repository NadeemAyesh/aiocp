<!-- Main Web Application Wrapper -->
<div class="min-h-screen flex flex-col justify-between selection:bg-[#f4921e] selection:text-[#001f3b]">
  
  <!-- 1. Header & Navigation (Integrated with Hero) -->
  <app-header 
    (searchClicked)="onOpenSearch()"
    (donateClicked)="onOpenDonate()"
  ></app-header>

  <!-- Main Content Area -->
  <main class="flex-grow">
    <!-- 2. Hero: Modern Interactive News & Activities Slider -->
    <app-hero-slider 
      (donateTrigger)="onOpenDonate()"
    ></app-hero-slider>

    <!-- 3. News & Activities Section (Content Focus) -->
    <app-news-activities 
      (articleSelected)="onArticleSelected($event)"
    ></app-news-activities>

    <!-- 4. Projects Section (4 Categorized Tabs with Progress) -->
    <app-projects 
      (projectDetails)="onProjectDetails($event)"
      (donateProject)="onDonateProject($event)"
    ></app-projects>

    <!-- 5. Media Center Section (Innovative Visual Presentation) -->
    <app-media-center 
      (openVideo)="onOpenVideo($event)"
      (openPhoto)="onOpenPhoto($event)"
    ></app-media-center>

    <!-- 6. About Us, Vision, Mission, Goals, Statistics & Partners -->
    <app-about-vision></app-about-vision>
  </main>

  <!-- 7. Footer (Exact Clone from donate.aiocp.org) -->
  <app-footer 
    (sharePage)="onOpenShare()"
  ></app-footer>

  <!-- Interactive Modals (Projects, Video, Photos, Articles, Share, Search, Donate) -->
  <app-modals
    [selectedProject]="selectedProject()"
    [selectedVideo]="selectedVideo()"
    [selectedPhoto]="selectedPhoto()"
    [selectedArticle]="selectedArticle()"
    [showShareModal]="showShareModal()"
    [showSearchModal]="showSearchModal()"
    [showDonateModal]="showDonateModal()"
    (closeProjectModal)="selectedProject.set(null)"
    (closeVideoModal)="selectedVideo.set(null)"
    (closePhotoModal)="selectedPhoto.set(null)"
    (closeArticleModal)="selectedArticle.set(null)"
    (closeShareModal)="showShareModal.set(false)"
    (closeSearchModal)="showSearchModal.set(false)"
    (closeDonateModal)="showDonateModal.set(false)"
    (openDonate)="onOpenDonate()"
  ></app-modals>

  <!-- Floating Quick Donate FAB (Mobile / Desktop) -->
  <div class="fixed bottom-6 left-6 z-40">
    <button 
      (click)="onOpenDonate()"
      class="bg-gradient-to-r from-[#f4921e] to-[#de7c0d] hover:from-[#ff9e2e] hover:to-[#f4921e] text-[#00172e] p-3.5 sm:px-5 sm:py-3.5 rounded-full font-black text-xs sm:text-sm shadow-2xl hover:scale-105 active:scale-95 transition-all duration-200 flex items-center gap-2 border-2 border-white/40"
      title="تبرع فوري للإعمار"
    >
      <svg class="w-5 h-5 fill-current animate-pulse text-[#00172e]" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span class="hidden sm:inline">تبرع لدعم غزة</span>
    </button>
  </div>

</div>
