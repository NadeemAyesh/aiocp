<svg xmlns="http://www.w3.org/2000/svg" width="1334.48" height="662.24" viewBox="0 0 1334.48 662.24" preserveAspectRatio="none">
  <!--
    The skyline out of the authority's own mark — one copy of it, and
    nothing added.

    Traced from the white cut-out of the full-resolution logo (1393x1599)
    at sub-pixel accuracy rather than redrawn: the cross over the church's
    dome, the crescent over the minaret, every stepped roof and every
    setback are the ones in the artwork. 279 pixel centres out of 927,738
    fall on the other side of the outline from the original, and all of
    them sit on anti-aliased edges.

    The block along the foot is the top of the mark's own panel, which is
    what the buildings stand on there.

    It is a mask, not a picture: the shape is painted flat black and the
    colour is set in CSS, so the tint stays with the rest of the tokens.
    One path, even-odd, so any enclosed loop stays a hole.

    preserveAspectRatio="none" is deliberate and is the whole reason the
    band can be as wide as the cards above it: without it the drawing keeps
    its own 2:1 and a wider box just centres it with air on both sides.
    With it, the box's proportions are the drawing's — which means the
    stylesheet, not this file, decides how round the dome and the crescent
    stay. Widen the box without giving it height and they flatten.
  -->
